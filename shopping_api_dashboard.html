<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Dashboard - Java Backend</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --light: #f8f9fa;
            --dark: #2c3e50;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            text-align: center;
        }

        .sidebar-logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .sidebar-title {
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sidebar-subtitle {
            font-size: 0.75em;
            opacity: 0.8;
            margin-top: 5px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--light);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.1) 0%, transparent 100%);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .sidebar-stats {
            padding: 20px;
            border-top: 1px solid var(--border);
        }

        .stat {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .stat:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .header-left h1 {
            font-size: 2em;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .header-subtitle {
            color: #999;
            font-size: 0.95em;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        /* Stats Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card-icon {
            font-size: 2.2em;
            margin-bottom: 15px;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .card-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .card-label {
            color: #999;
            font-size: 0.9em;
            font-weight: 600;
        }

        /* Form Section */
        .add-item-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .form-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
            width: 100%;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Items Section */
        .items-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--dark);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #666;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: var(--light);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
        }

        .item:hover {
            box-shadow: var(--shadow-lg);
            background: white;
            transform: translateX(5px);
        }

        .item.completed {
            opacity: 0.65;
            border-left-color: var(--success);
            background: rgba(76, 175, 80, 0.05);
        }

        .item-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .item.completed .item-name {
            text-decoration: line-through;
            color: #999;
        }

        .item-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
        }

        .item-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: scale(1.12);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 15px;
        }

        .empty-text {
            color: #999;
            font-size: 1.1em;
        }

        /* Notifications */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            z-index: 2000;
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .item {
                flex-wrap: wrap;
            }

            .item-meta {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🛒</div>
                <div class="sidebar-title">ShopList Pro</div>
                <div class="sidebar-subtitle">Java Backend</div>
            </div>

            <div class="sidebar-nav">
                <div class="nav-item active" onclick="switchTab('dashboard')">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" onclick="switchTab('items')">
                    <i class="fas fa-list"></i>
                    <span>All Items</span>
                </div>
                <div class="nav-item" onclick="loadCompleted()">
                    <i class="fas fa-check-circle"></i>
                    <span>Completed</span>
                </div>
                <div class="nav-item" onclick="loadIncomplete()">
                    <i class="fas fa-clock"></i>
                    <span>Incomplete</span>
                </div>
            </div>

            <div class="sidebar-stats">
                <div class="stat">
                    <div class="stat-label">Total Items</div>
                    <div class="stat-value" id="sidebar-total">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="sidebar-completed">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total Budget</div>
                    <div class="stat-value" id="sidebar-total-price">$0</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <h1>Shopping Dashboard</h1>
                    <div class="header-subtitle">Java Backend API Integration</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="addNewItem()">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid">
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="card-value" id="total-items">0</div>
                    <div class="card-label">Total Items</div>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="card-value" id="completed-items">0</div>
                    <div class="card-label">Completed Items</div>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="card-value" id="total-price">$0</div>
                    <div class="card-label">Total Budget</div>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-percent"></i>
                    </div>
                    <div class="card-value" id="progress-percent">0%</div>
                    <div class="card-label">Progress</div>
                </div>
            </div>

            <!-- Add Item Form -->
            <div class="add-item-section">
                <div class="form-header">
                    <i class="fas fa-plus"></i> Add New Item
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Item Name</label>
                        <input type="text" class="form-input" id="item-name" placeholder="e.g., Milk...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-input" id="item-quantity" placeholder="1" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="item-category">
                            <option value="Grocery">Grocery</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Home">Home</option>
                            <option value="Health">Health</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price ($)</label>
                        <input type="number" class="form-input" id="item-price" placeholder="0.00" min="0" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="submitAddItem()">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>
            </div>

            <!-- Items List -->
            <div class="items-section">
                <div class="section-header">
                    <div class="section-title">Shopping Items</div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="loadAllItems()">All</button>
                        <button class="filter-btn" onclick="loadIncomplete()">Pending</button>
                        <button class="filter-btn" onclick="loadCompleted()">Completed</button>
                    </div>
                </div>
                <div class="items-list" id="items-list">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">No items yet. Add one to get started!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api/items';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAllItems();
            loadStatistics();
        });

        // Load all items
        async function loadAllItems() {
            try {
                const response = await fetch(`${API_BASE_URL}`);
                const data = await response.json();
                
                if (data.success) {
                    renderItems(data.data);
                    updateStats(data.data);
                    showNotification('Items loaded successfully', 'success');
                } else {
                    showNotification('Failed to load items', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error connecting to server', 'error');
            }
        }

        // Load completed items
        async function loadCompleted() {
            try {
                const response = await fetch(`${API_BASE_URL}/filter/completed`);
                const data = await response.json();
                
                if (data.success) {
                    renderItems(data.data);
                    updateFilterButtons(event.target);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Load incomplete items
        async function loadIncomplete() {
            try {
                const response = await fetch(`${API_BASE_URL}/filter/incomplete`);
                const data = await response.json();
                
                if (data.success) {
                    renderItems(data.data);
                    updateFilterButtons(event.target);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Submit add item form
        async function submitAddItem() {
            const name = document.getElementById('item-name').value.trim();
            const quantity = parseInt(document.getElementById('item-quantity').value) || 1;
            const category = document.getElementById('item-category').value;
            const price = parseFloat(document.getElementById('item-price').value) || 0;

            if (!name) {
                showNotification('Please enter an item name', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        quantity,
                        category,
                        price,
                        completed: false
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification(`✓ ${name} added successfully!`, 'success');
                    resetForm();
                    loadAllItems();
                } else {
                    showNotification(data.message || 'Failed to add item', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error adding item', 'error');
            }
        }

        // Toggle item completion
        async function toggleItem(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}/toggle`, {
                    method: 'PATCH'
                });

                const data = await response.json();

                if (data.success) {
                    showNotification(data.message, 'success');
                    loadAllItems();
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error updating item', 'error');
            }
        }

        // Delete item
        async function deleteItem(id) {
            if (confirm('Are you sure you want to remove this item?')) {
                try {
                    const response = await fetch(`${API_BASE_URL}/${id}`, {
                        method: 'DELETE'
                    });

                    const data = await response.json();

                    if (data.success) {
                        showNotification('✓ Item removed!', 'success');
                        loadAllItems();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showNotification('Error deleting item', 'error');
                }
            }
        }

        // Render items
        function renderItems(items) {
            const list = document.getElementById('items-list');

            if (!items || items.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No items found</div></div>';
                return;
            }

            list.innerHTML = items.map(item => `
                <div class="item ${item.completed ? 'completed' : ''}">
                    <input type="checkbox" class="item-checkbox" ${item.completed ? 'checked' : ''} 
                        onchange="toggleItem('${item.id}')">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta">
                            <div class="item-meta-item">
                                <i class="fas fa-tag"></i>
                                <span>${item.category}</span>
                            </div>
                            <div class="item-meta-item">
                                <i class="fas fa-cubes"></i>
                                <span>Qty: ${item.quantity}</span>
                            </div>
                            <div class="item-meta-item">
                                <i class="fas fa-dollar-sign"></i>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-icon btn-delete" onclick="deleteItem('${item.id}')" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats/summary`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.data;
                    document.getElementById('total-items').textContent = stats.totalItems;
                    document.getElementById('completed-items').textContent = stats.completedItems;
                    document.getElementById('total-price').textContent = `$${stats.totalPrice}`;
                    document.getElementById('progress-percent').textContent = `${stats.progressPercentage}%`;

                    document.getElementById('sidebar-total').textContent = stats.totalItems;
                    document.getElementById('sidebar-completed').textContent = stats.completedItems;
                    document.getElementById('sidebar-total-price').textContent = `$${stats.totalPrice}`;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Update stats
        function updateStats(items) {
            const total = items.length;
            const completed = items.filter(i => i.completed).length;
            const totalPrice = items.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const progress = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('total-items').textContent = total;
            document.getElementById('completed-items').textContent = completed;
            document.getElementById('total-price').textContent = `$${totalPrice.toFixed(2)}`;
            document.getElementById('progress-percent').textContent = `${progress}%`;
        }

        // Helper functions
        function resetForm() {
            document.getElementById('item-name').value = '';
            document.getElementById('item-quantity').value = '1';
            document.getElementById('item-category').value = 'Grocery';
            document.getElementById('item-price').value = '0';
        }

        function addNewItem() {
            document.getElementById('item-name').focus();
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }

        function updateFilterButtons(button) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
